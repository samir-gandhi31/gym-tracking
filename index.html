<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Tracker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1c1a;--mut:#75736c;--line:#e4e2da;--acc:#0f766e;--accbg:#d9f0ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--ink:#f0eee8;--mut:#9a978e;--line:#33332f;--acc:#4fd1c5;--accbg:#153b37;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--ink:#f0eee8;--mut:#9a978e;--line:#33332f;--acc:#4fd1c5;--accbg:#153b37;color-scheme:dark}
*{box-sizing:border-box}html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0;font-size:16px}.tgt{color:var(--mut);font-size:13px;margin-bottom:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;margin-top:6px}
.set span{color:var(--mut);font-size:13px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--accbg);color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.top input{width:auto}
.link{background:none;border:0;color:var(--acc);font:inherit;font-size:14px;padding:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.wrap{overflow-x:auto}#status{font-size:12px;color:var(--mut)}
</style></head><body><main>
<h1>Lift Tracker</h1>
<div class="sub">4 days · ~30 min · <span id="status">loading…</span></div>
<div class="tabs" id="tabs"></div>
<div class="top"><input type="date" id="date"><span><button class="link" id="unit"></button> · <button class="link" id="sync">Sync</button></span></div>
<div id="view"></div>
</main>
